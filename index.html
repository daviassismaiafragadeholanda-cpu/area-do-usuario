<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Rango dos Guri</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header>
        <h1>A Rango dos Guri</h1>

        <nav>
            <a href="#inicio">Início</a>
            <a href="#cardapio">Cardápio</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>

    <main>

        <section id="inicio" class="inicio">

            <div class="apresentacao">
                <span>A RANGO DOS GURI</span>

                <h2>Acesso ao sistema</h2>

                <p>Entre para acessar sua conta.</p>
            </div>

            <div id="autenticacao" class="autenticacao">

                <div class="autenticacao-cabecalho">
                    <h2>Entrar</h2>
                    <p>Acesse sua conta</p>
                </div>

                <form>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            required
                        >
                    </div>

                    <div class="opcoes-login">
                        <label>
                            <input type="checkbox" name="lembrar">
                            Lembrar-me
                        </label>

                        <a href="#">Esqueci minha senha</a>
                    </div>

                    <button type="submit">
                        Entrar
                    </button>

                </form>

                <div class="cadastro">
                    <p>Não possui uma conta?</p>
                    <a href="#">Criar conta</a>
                </div>

            </div>

        </section>

        <section id="cardapio" class="cardapio">
            <h2>Cardápio</h2>
            <p>Visualização do cardápio.</p>
        </section>

        <section id="contato" class="contato">
            <h2>Contato</h2>
            <p>Entre em contato com A Rango dos Guri.</p>
        </section>

    </main>

    <footer>
        <p>A Rango dos Guri</p>
    </footer>

</body>
</html>
