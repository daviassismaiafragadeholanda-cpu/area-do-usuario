<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RANGO DOS GURI</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header>
        <h1>A Rango dos Guri</h1>

        <nav>
            <ul>
            <li><a href="#inicio">Início</a></li>
            <li><a href="#cardapio">Cardápio</a></li>
            <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>

        <a href="#autenticacao" class="botao-entrar">Entrar</a>
    </header>

    <main>

        <section id="inicio" class="inicio">

            <div class="apresentacao">
                <span>RANGO DOS GURI</span>

                <h2>Acesso ao sistema</h2>

                <p>
                    Entre na sua conta para acessar o restaurante.
                </p>
            </div>

            <div id="autenticacao" class="autenticacao">

                <div class="autenticacao-cabecalho">
                    <h2>Entrar</h2>
                    <p>Acesse sua conta</p>
                </div>

                <form>

                    <div class="campo">
                        <label for="email">E-mail</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            required
                        >
                    </div>

                    <div class="opcoes-login">
                        <label>
                            <input type="checkbox" name="lembrar">
                            Lembrar-me
                        </label>

                        <a href="#">Esqueci minha senha</a>
                    </div>

                    <button type="submit">
                        Entrar
                    </button>

                </form>

                <div class="cadastro">
                    <p>Não possui uma conta?</p>

                    <a href="#">
                        Criar conta
                    </a>
                </div>

            </div>

        </section>
        
<section id="cardapio" class="cardapio">
    <h2>Cardápio</h2>
</section>

<section id="contato" class="contato">

    <div class="contato-conteudo">
        <span>CONTATO</span>

        <h2>Contato</h2>

        <div class="contato-info">

            <div>
                <strong>Telefone</strong>
                <p>(00) 00000-0000</p>
            </div>

        </div>

    </div>

</section>
        
    </main>

</body>
</html>
